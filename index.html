<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HilltopAds VAST Player</title>
<meta name="theme-color" content="#0b0c0f">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.fluidplayer.com/v3/current/fluidplayer.min.css">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#0b0c0f;color:#e5e7eb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif}
body{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:16px}
.wrap{width:100%;max-width:480px}
.card{background:#111319;border:1px solid #1f232e;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #1f232e}
.brand{font-size:13px;font-weight:600;letter-spacing:.3px;color:#d1d5db}
.dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 10px rgba(34,197,94,.6);margin-right:8px;display:inline-block}
.left{display:flex;align-items:center}
.badge{font-size:10px;color:#9ca3af;background:#0a0c10;border:1px solid #222838;padding:3px 7px;border-radius:999px;text-transform:uppercase;letter-spacing:.4px}
.player{position:relative;background:#000;aspect-ratio:16/9}
video{width:100%;height:100%;display:block;background:#000}
.note{padding:10px 14px;font-size:12px;line-height:1.4;color:#9aa3b2;text-align:center;border-top:1px solid #1f232e}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="head">
      <div class="left"><span class="dot"></span><span class="brand">HilltopAds VAST Player</span></div>
      <span class="badge">Fluid Player v3</span>
    </div>
    <div class="player">
      <video id="hilltop-player" playsinline muted controls preload="metadata" poster="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxNiA5Ij48cmVjdCB3aWR0aD0iMTYiIGhlaWdodD0iOSIgZmlsbD0iIzAwMDAwMCIvPjwvc3ZnPg==">
        <source src="https://cdn.fluidplayer.com/videos/valerian.mp4" type="video/mp4">
      </video>
    </div>
    <div class="note">Tap play to start. HilltopAds only — onclckstr tags return no fill in MW.</div>
  </div>
</div>

<script src="https://cdn.fluidplayer.com/v3/current/fluidplayer.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  fluidPlayer('hilltop-player', {
    layoutControls: {
      fillToContainer: true,
      autoPlay: false,
      mute: true,
      posterImage: false,
      controlBar: {
        autoHide: true,
        autoHideTimeout: 3
      }
    },
    vastOptions: {
      vpaidMode: 'INSECURE',
      adList: [
        {
          roll: 'preRoll',
          vastTag: 'https://mellow-habit.com/d/m/F.z/dvGNNvMZHGVUZ/jeFm/9muCZyUHlRkgPvT/cMwsNizucZzlM/D/U_t/NgzAAw3DN/zAMFwHOKQl',
          adText: 'Advertisement'
        }
      ]
    }
  });
});
</script>
</body>
</html>
