<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAST Video Player - Fixed</title>
    
    <!-- Video.js CSS -->
    <link href="https://vjs.zencdn.net/8.6.1/video-js.css" rel="stylesheet" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .player-container {
            width: 100%;
            max-width: 960px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 25px 80px rgba(0,0,0,0.8);
        }

        .video-js {
            width: 100%;
            height: auto;
            aspect-ratio: 16/9;
        }

        .video-js .vjs-big-play-button {
            background: rgba(0, 150, 255, 0.8);
            border: none;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            line-height: 80px;
            font-size: 40px;
            transition: all 0.3s ease;
        }

        .video-js .vjs-big-play-button:hover {
            background: rgba(0, 150, 255, 1);
            transform: scale(1.1);
        }

        .ad-info {
            padding: 15px 20px;
            background: #1a1a1a;
            color: #fff;
        }

        .ad-info h3 {
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .ad-info p {
            color: #888;
            font-size: 0.85rem;
        }

        .status {
            padding: 10px 20px;
            background: #222;
            color: #0f0;
            font-family: monospace;
            font-size: 0.8rem;
            display: none;
        }

        .status.error {
            color: #f44;
        }

        .status.loading {
            display: block;
            color: #ff0;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <div id="status" class="status">Loading...</div>
        <video id="my_video" class="video-js vjs-default-skin" controls preload="auto" playsinline>
            <p class="vjs-no-js">Please enable JavaScript to view this video.</p>
        </video>
        
        <div class="ad-info">
            <h3>VAST Ad Player</h3>
            <p>HilltopAds VAST Tag • Fixed Version</p>
        </div>
    </div>

    <!-- Video.js -->
    <script src="https://vjs.zencdn.net/8.6.1/video.min.js"></script>
    
    <!-- Google IMA SDK -->
    <script src="https://imasdk.googleapis.com/js/sdkloader/ima3.js"></script>
    
    <!-- Video.js IMA Plugin -->
    <script src="https://cdn.jsdelivr.net/npm/videojs-ima@1.11.0/dist/videojs.ima.min.js"></script>

    <script>
        var statusDiv = document.getElementById('status');
        var vastTag = 'https://mellow-habit.com/d.mNFnz/ddGaNCvEZMG/UO/fe_m/9NumZGUml/k/PITLcnw/NmzncBz-McD/UJtWNbzYAg3LNszGMSw/OOQl';

        function showStatus(msg, type) {
            statusDiv.textContent = msg;
            statusDiv.style.display = 'block';
            statusDiv.className = 'status ' + (type || '');
        }

        var player = videojs('my_video', {
            html5: {
                vhs: {
                    overrideNative: true,
                    limitRenditionByPlayerDimensions: true
                }
            }
        });

        // Initialize IMA with the VAST tag
        player.ima({
            id: 'my_video',
            adTagUrl: vastTag,
            debug: true,
            adsRenderingSettings: {
                enablePreloading: true,
                useStyledNonLinearAds: true
            },
            adWillPlayMuted: true,
            contribAdsSettings: {
                debug: true,
                timeout: 5000,
                prerollTimeout: 1000,
                adLabel: 'Advertisement'
            }
        });

        // Event handlers
        player.on('ready', function() {
            showStatus('Player ready - requesting ads...', 'loading');
            
            // Initialize ad display container
            player.ima.initializeAdDisplayContainer();
            
            // Request ads
            player.ima.requestAds();
        });

        player.on('adsready', function() {
            showStatus('Ads loaded - starting playback');
            player.play();
        });

        player.on('adstart', function() {
            showStatus('Ad playing...');
        });

        player.on('adend', function() {
            showStatus('Ad complete');
            setTimeout(() => { statusDiv.style.display = 'none'; }, 2000);
        });

        player.on('adskip', function() {
            showStatus('Ad skipped');
        });

        player.on('aderror', function(event) {
            console.error('Ad error:', event);
            showStatus('Ad error - playing content', 'error');
            
            // Hide error and play content if available
            setTimeout(() => {
                statusDiv.style.display = 'none';
                // Try to play main content
                if (player.src()) {
                    player.play();
                }
            }, 2000);
        });

        player.on('error', function() {
            var error = player.error();
            console.error('Player error:', error);
            showStatus('Error: ' + (error ? error.message : 'Unknown'), 'error');
        });

        // Auto-start on mobile requires user interaction
        document.body.addEventListener('click', function() {
            if (player.paused()) {
                player.play();
            }
        }, { once: true });

        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            if (e.code === 'Space' && document.activeElement.tagName !== 'BUTTON') {
                e.preventDefault();
                player.paused() ? player.play() : player.pause();
            }
            if (e.code === 'KeyF') {
                if (!document.fullscreenElement) {
                    player.requestFullscreen();
                } else {
                    document.exitFullscreen();
                }
            }
        });

        // Initialize
        player.ready(function() {
            player.muted(true);
        });
    </script>

</body>
</html>
