    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));

  }

function showForgot(){
  document.getElementById('forgotBox').style.display = document.getElementById('forgotBox').style.display==='none'?'block':'none';
}
function resetPassword(){
  var email = document.getElementById('forgotEmail').value.trim();
  var newPass = document.getElementById('newPass').value;
  var msg = document.getElementById('forgotMsg');
  if(!email || newPass.length<6){ msg.innerHTML='<span style="color:#ff6b6b">Enter valid email and new password (min 6 chars)</span>'; return; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ msg.innerHTML='<span style="color:#ff6b6b">📧 Invalid email format</span>'; return; }
  if(!db){ msg.innerHTML='<span style="color:#ff6b6b">Database not ready</span>'; return; }
  db.ref('users').orderByChild('email').equalTo(email).once('value', function(snap){
    if(!snap.exists()){ msg.innerHTML='<span style="color:#ff6b6b">Email not found</span>'; return; }
    snap.forEach(function(child){
      var username = child.key;
      db.ref('users/'+username).update({password: md5(newPass)});
      msg.innerHTML='<span style="color:#51cf66">✅ Password reset! Login with new password</span>';
    });
  });
}
</script>
