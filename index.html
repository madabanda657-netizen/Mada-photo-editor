<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAST Video Player</title>
    
    <!-- Video.js CSS -->
    <link href="https://vjs.zencdn.net/8.6.1/video-js.css" rel="stylesheet" />
    
    <!-- Video.js IMA Plugin CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/videojs-ima@1.11.0/dist/videojs.ima.css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .player-container {
            width: 100%;
            max-width: 960px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 25px 80px rgba(0,0,0,0.8);
        }

        .video-js {
            width: 100%;
            height: auto;
            aspect-ratio: 16/9;
        }

        .video-js .vjs-big-play-button {
            background: rgba(0, 150, 255, 0.8);
            border: none;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            line-height: 80px;
            font-size: 40px;
            transition: all 0.3s ease;
        }

        .video-js .vjs-big-play-button:hover {
            background: rgba(0, 150, 255, 1);
            transform: scale(1.1);
        }

        .vjs-ads-label {
            display: none !important;
        }

        .ad-info {
            padding: 15px 20px;
            background: #1a1a1a;
            color: #fff;
        }

        .ad-info h3 {
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .ad-info p {
            color: #888;
            font-size: 0.85rem;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: #fff;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #0096ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            color: #ff4444;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <video id="content_video" class="video-js vjs-default-skin" controls preload="auto" playsinline>
            <!-- Main content video (optional - will play after ads) -->
            <source src="" type="video/mp4" />
            <p class="vjs-no-js">
                To view this video please enable JavaScript, and consider upgrading to a web browser that
                <a href="https://videojs.com/html5-video-support/" target="_blank">supports HTML5 video</a>
            </p>
        </video>
        
        <div class="ad-info">
            <h3>VAST Ad Player</h3>
            <p>HilltopAds VAST Tag • Auto-plays with sound muted</p>
        </div>
    </div>

    <!-- Video.js -->
    <script src="https://vjs.zencdn.net/8.6.1/video.min.js"></script>
    
    <!-- Google IMA SDK -->
    <script src="https://imasdk.googleapis.com/js/sdkloader/ima3.js"></script>
    
    <!-- Video.js IMA Plugin -->
    <script src="https://cdn.jsdelivr.net/npm/videojs-ima@1.11.0/dist/videojs.ima.min.js"></script>

    <script>
        var player = videojs('content_video', {
            html5: {
                vhs: {
                    overrideNative: true,
                    limitRenditionByPlayerDimensions: true,
                    useDevicePixelRatio: true
                }
            }
        });

        // VAST Ad Tag URL
        var vastTag = 'https://mellow-habit.com/d.mNFnz/ddGaNCvEZMG/UO/fe_m/9NumZGUml/k/PITLcnw/NmzncBz-McD/UJtWNbzYAg3LNszGMSw/OOQl';

        var options = {
            id: 'content_video',
            adTagUrl: vastTag,
            adsRenderingSettings: {
                enablePreloading: true,
                useStyledNonLinearAds: true
            },
            adWillPlayMuted: true,
            contribAdsSettings: {
                debug: true
            }
        };

        player.ima(options);

        // Auto-play with muted (required by most browsers)
        player.ready(function() {
            player.muted(true);
            player.ima.initializeAdDisplayContainer();
            player.ima.requestAds();
            
            // Try to play after ads are loaded
            player.one('adsready', function() {
                player.play();
            });
        });

        // Event listeners
        player.on('ads-ad-started', function() {
            console.log('Ad started');
        });

        player.on('ads-ad-ended', function() {
            console.log('Ad ended');
        });

        player.on('ads-error', function(event) {
            console.error('Ad error:', event);
            // Continue to content if ad fails
            player.play();
        });

        player.on('error', function() {
            console.error('Player error:', player.error());
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            if (e.code === 'Space' && document.activeElement.tagName !== 'BUTTON') {
                e.preventDefault();
                player.paused() ? player.play() : player.pause();
            }
            if (e.code === 'KeyF') {
                if (!document.fullscreenElement) {
                    player.requestFullscreen();
                } else {
                    document.exitFullscreen();
                }
            }
        });
    </script>

</body>
</html>
